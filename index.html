<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tarjetas — Spanish Flashcards</title>
<meta name="theme-color" content="#D4580A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tarjetas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #F7EFE6;
    --surface: #FFFFFF;
    --surface-2: #F0EDE8;
    --ink: #1A1814;
    --ink-2: #6B6560;
    --ink-3: #A8A39D;
    --accent: #D4580A;
    --accent-light: #FAE8DA;
    --green: #2D7A4F;
    --green-light: #D6F0E3;
    --red: #C0392B;
    --red-light: #FBDBD8;
    --border: #E4E0DA;
    --shadow: 0 2px 12px rgba(26,24,20,0.08);
    --shadow-lg: 0 8px 40px rgba(26,24,20,0.14);
    --radius: 16px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .screen { display: none; flex-direction: column; height: 100dvh; overflow: hidden; }
  .screen.active { display: flex; }

  /* ── HOME ── */
  #home { overflow-y: scroll; padding: 0 0 80px; -webkit-overflow-scrolling: touch; }

  .home-header {
    padding: 52px 24px 24px;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .home-header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 32px;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }
  .home-header h1 span { font-style: italic; color: var(--accent); }

  .filter-pill {
    background: var(--surface);
    color: var(--ink-2);
    border: 1.5px solid var(--border);
    border-radius: 99px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-pill:hover { border-color: var(--accent); color: var(--ink); }
  .filter-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .deck-list { padding: 8px 16px; }
  .deck-card { }
  .script-card { }

  .deck-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px 20px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    box-shadow: var(--shadow);
    border: 1.5px solid transparent;
    transition: box-shadow 0.18s ease, border-color 0.18s ease, opacity 0.18s ease;
    touch-action: pan-y;
  }
  .deck-card:hover { border-color: var(--accent); }
  .deck-card:active { opacity: 0.95; }
  .deck-card.dragging {
    opacity: 0.5;
    border-color: var(--accent);
    box-shadow: var(--shadow-lg);
  }
  .deck-card.drag-over {
    border-color: var(--accent);
    border-style: dashed;
  }

  .deck-card-inner {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .deck-card-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .deck-card-text { flex: 1; min-width: 0; }
  .deck-card h3 { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
  .deck-card .deck-meta { font-size: 12px; color: var(--ink-2); margin-top: 3px; font-style: italic; }

  .deck-card .deck-actions {
    display: flex;
    flex-direction: row;
    gap: 6px;
    flex-shrink: 0;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 99px;
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:active { opacity: 0.7; animation: btnPress 0.3s ease; }

  .btn-secondary {
    background: var(--surface-2);
    color: var(--ink);
    border: none;
    border-radius: 99px;
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-secondary:active, .btn-secondary.pressed {
    animation: btnPress 0.3s ease;
  }

  .fab {
    background: none;
    color: var(--accent);
    border: none;
    border-radius: 99px;
    padding: 6px 4px;
    font-size: 26px;
    font-weight: 300;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    line-height: 1;
    transition: opacity 0.15s;
  }
  .fab:hover { opacity: 0.7; }
  .fab:active { opacity: 0.5; animation: btnPress 0.3s ease; }

  /* ── STUDY ── */
  #study { background: var(--bg); }

  .study-header {
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .btn-icon {
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    border-radius: var(--radius-sm);
    color: var(--ink-2);
    font-size: 20px;
    display: flex;
    align-items: center;
    transition: background 0.15s;
  }
  .btn-icon:hover { background: var(--surface-2); color: var(--ink); }

  .study-header-center { flex: 1; text-align: center; }
  .study-deck-name { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
  .study-counter { font-size: 12px; color: var(--ink-2); }

  .study-progress-bar { height: 3px; background: var(--surface-2); flex-shrink: 0; }
  .study-progress-fill { height: 100%; background: var(--accent); transition: width 0.3s ease; }

  .card-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 20px;
    position: relative;
    overflow: hidden;
  }

  .swipe-hint {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 360px;
    margin-bottom: 14px;
    flex-shrink: 0;
  }
  .swipe-hint span { font-size: 12px; font-weight: 500; color: var(--ink-3); }

  .flashcard-wrapper {
    width: 100%;
    max-width: 360px;
    perspective: 1200px;
    flex-shrink: 0;
  }

  .flashcard {
    width: 100%;
    aspect-ratio: 4/3;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
    cursor: pointer;
    user-select: none;
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .flashcard.swipe-left {
    transform: translateX(-140%) rotate(-20deg) !important;
    opacity: 0;
    transition: transform 0.35s ease, opacity 0.35s ease !important;
  }
  .flashcard.swipe-right {
    transform: translateX(140%) rotate(20deg) !important;
    opacity: 0;
    transition: transform 0.35s ease, opacity 0.35s ease !important;
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .card-front { background: var(--surface); border: 1.5px solid var(--border); }
  .card-back { background: var(--ink); transform: rotateY(180deg); }

  .card-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 10px;
  }
  .card-back .card-label { color: rgba(255,255,255,0.3); }

  .card-word {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    text-align: center;
    line-height: 1.25;
    letter-spacing: -0.3px;
    color: var(--ink);
  }
  .card-back .card-word { color: #fff; }

  .card-context {
    font-size: 13px;
    color: var(--ink-2);
    margin-top: 10px;
    text-align: center;
    font-style: italic;
    line-height: 1.4;
  }
  .card-back .card-context { color: rgba(255,255,255,0.45); }

  .card-tap-hint { margin-top: 18px; font-size: 11px; color: var(--ink-3); }

  .btn-speaker {
    margin-top: 16px;
    background: rgba(255,255,255,0.12);
    border: none;
    border-radius: 99px;
    padding: 7px 14px;
    color: #fff;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s;
  }
  .btn-speaker:hover { background: rgba(255,255,255,0.2); }

  .swipe-badge { display:none !important; } .swipe-badge-hidden {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    padding: 8px 16px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.1s;
  }
  .swipe-badge.know { right: 16px; background: var(--green-light); color: var(--green); border: 2px solid var(--green); }
  .swipe-badge.skip { left: 16px; background: var(--red-light); color: var(--red); border: 2px solid var(--red); }

  .study-actions {
    padding: 14px 20px 22px;
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .action-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--surface);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s;
    box-shadow: var(--shadow);
    color: var(--ink-2);
  }
  .action-btn:hover { transform: scale(1.08); }
  .action-btn.wrong { border-color: var(--red); color: var(--red); }
  .action-btn.wrong:hover { background: var(--red-light); }
  .action-btn.right { border-color: var(--green); color: var(--green); }
  .action-btn.right:hover { background: var(--green-light); }
  .action-btn.neutral:hover { background: var(--surface-2); }

  .round-complete {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    text-align: center;
  }
  .round-complete .big-emoji { font-size: 60px; margin-bottom: 18px; }
  .round-complete h2 { font-family: 'DM Serif Display', serif; font-size: 28px; letter-spacing: -0.4px; margin-bottom: 8px; }
  .round-complete p { color: var(--ink-2); font-size: 15px; margin-bottom: 28px; }
  .round-complete .stat-row { display: flex; gap: 16px; margin-bottom: 32px; }
  .stat-box { background: var(--surface); border-radius: var(--radius); padding: 16px 24px; box-shadow: var(--shadow); }
  .stat-box .stat-num { font-family: 'DM Serif Display', serif; font-size: 32px; color: var(--accent); }
  .stat-box .stat-label { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

  /* ── AUTOPLAY ── */
  #autoplay { background: var(--ink); }

  .autoplay-header {
    padding: 20px 20px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .autoplay-header .btn-icon { color: rgba(255,255,255,0.5); }
  .autoplay-header .btn-icon:hover { color: #fff; background: rgba(255,255,255,0.1); }
  .autoplay-title { flex: 1; font-size: 15px; font-weight: 600; color: #fff; }

  .autoplay-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 24px;
  }

  .autoplay-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius);
    width: 100%;
    max-width: 360px;
    padding: 24px 28px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
    overflow: hidden;
  }


  .autoplay-lang-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
  }

  .autoplay-word {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: #fff;
    line-height: 1.3;
    letter-spacing: -0.2px;
    height: calc(22px * 1.3 * 2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .autoplay-divider {
    width: 32px;
    height: 1px;
    background: rgba(255,255,255,0.15);
    margin: 2px 0;
  }

  .autoplay-spanish {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--accent);
    font-style: italic;
    line-height: 1.3;
    height: calc(22px * 1.3 * 2);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
  }

  .autoplay-progress { width: 100%; max-width: 360px; }
  .autoplay-progress-track {
    height: 3px;
    background: rgba(255,255,255,0.12);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .autoplay-progress-fill { height: 100%; background: var(--accent); border-radius: 99px; }
  .autoplay-progress-label { text-align: center; font-size: 12px; color: rgba(255,255,255,0.3); }

  .autoplay-controls { display: flex; gap: 16px; align-items: center; }

  .ctrl-btn {
    background: rgba(255,255,255,0.1);
    border: none;
    border-radius: 50%;
    width: 52px;
    height: 52px;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.18); }

  /* Play and pause buttons share the same style */
  .ctrl-btn.play-pause {
    width: 64px;
    height: 64px;
    font-size: 22px;
    background: var(--accent);
    box-shadow: 0 4px 20px rgba(212,88,10,0.5);
  }
  .ctrl-btn.play-pause:hover { background: #E8650F; }

  /* ── MODALS ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,24,20,0.6);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 28px 24px 40px;
    max-height: 85dvh;
    overflow-y: auto;
    animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
  }
  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal h2 { font-family: 'DM Serif Display', serif; font-size: 22px; margin-bottom: 20px; letter-spacing: -0.3px; }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-2);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }
  .form-group input, .form-group select {
    width: 100%;
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent); }

  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions .btn-primary { flex: 1; padding: 14px; font-size: 15px; border-radius: var(--radius-sm); }
  .modal-actions .btn-secondary { padding: 14px 20px; border-radius: var(--radius-sm); }

  .word-list { margin-top: 8px; }
  .word-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 0 11px 12px;
    border-bottom: 1px solid var(--border);
    transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    user-select: none;
  }
  .word-item:last-child { border-bottom: none; }
  .word-item.dragging { opacity: 0.4; }
  .word-en { flex: 1; font-size: 14px; font-weight: 500; min-width: 0; }
  .word-es { flex: 1; font-size: 14px; color: var(--accent); font-style: italic; min-width: 0; }

  #deck-detail-name { font-family: 'DM Serif Display', serif; font-size: 22px; margin-bottom: 4px; letter-spacing: -0.3px; }
  #deck-detail-count { color: var(--ink-2); font-size: 13px; margin-bottom: 20px; }

  /* ── SCRIPTS ── */
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateX(-24px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes playerSlideIn {
    from { opacity: 0; transform: translateY(40px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes btnPress {
    0%   { transform: scale(1); }
    40%  { transform: scale(0.88); }
    100% { transform: scale(1); }
  }
  .card-fade-in {
    animation: fadeSlideIn 0.35s ease both;
  }
  #header-subtitle {
    transition: opacity 0.25s ease;
  }
  .script-play-btn {
    transition: transform 0.15s ease;
  }
  .script-play-btn:active, .script-play-btn.pressed {
    animation: btnPress 0.3s ease;
  }
  .player-play-btn:active, .player-play-btn.pressed {
    animation: btnPress 0.3s ease;
  }
  #script-player.slide-in {
    animation: playerSlideIn 0.4s cubic-bezier(0.4,0,0.2,1) both;
  }

  /* Deck card and button press animations */
  .deck-card:active {
    animation: btnPress 0.25s ease;
  }
  .btn-primary:active {
    animation: btnPress 0.25s ease;
  }
  .script-play-btn:active {
    animation: btnPress 0.25s ease;
  }

  /* Screen slide-in animations */
  @keyframes screenSlideUp {
    from { opacity: 0; transform: translateY(32px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #study.slide-in, #autoplay.slide-in {
    animation: screenSlideUp 0.35s cubic-bezier(0.4,0,0.2,1) both;
  }

  .script-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 12px;
    cursor: pointer;
    box-shadow: var(--shadow);
    border: 1.5px solid transparent;
    transition: box-shadow 0.18s ease, border-color 0.18s ease, opacity 0.18s ease;
    touch-action: pan-y;
  }
  .script-card:hover { border-color: var(--accent); }
  .script-card.dragging { opacity: 0.4; border-color: var(--accent); }

  .script-card-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .script-card-text { flex: 1; min-width: 0; }
  .script-card h3 { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; color: var(--ink); }
  .script-card .script-meta { font-size: 12px; color: var(--ink-2); margin-top: 3px; font-style: italic; }
  .script-play-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--accent); border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: opacity 0.15s;
  }
  .script-play-btn:hover { opacity: 0.85; }

  #script-player.active {
    background: var(--ink);
    display: flex;
    flex-direction: column;
  }

  .player-header {
    padding: 20px 20px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .player-title {
    flex: 1;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
  }

  .player-text-area {
    flex: 1;
    overflow-y: auto;
    padding: 100px 24px 80px;
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    line-height: 1.7;
    color: #fff;
    scroll-behavior: smooth;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 85%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 85%, transparent 100%);
  }

  .player-sentence {
    display: inline;
    cursor: pointer;
    transition: color 0.2s;
  }
  .player-sentence.done { color: rgba(255,255,255,0.25); }
  .player-sentence.active { color: #D4580A; }
  .player-sentence.upcoming { color: #fff; }

  .player-sentence.selected-word {
    background: rgba(212,88,10,0.4);

  .player-btn {

    align-items: flex-end;
    justify-content: center;

  .fc-popup {

async function syncFromSheet() {
  if (!scriptUrl) return;
  setSyncStatus('syncing');
  try {
    const res = await fetch(scriptUrl + '?action=read');
    const data = await res.json();
    if (data.ok && data.decks) {
      decks = data.decks;
      localStorage.setItem('tarjetas-decks', JSON.stringify(decks));
      setSyncStatus('ok');
      renderHome();
    } else {
      setSyncStatus('error');
    }
  } catch (e) {
    setSyncStatus('error');
  }
}

async function syncToSheet() {
  if (!scriptUrl) return;
  setSyncStatus('syncing');
  try {
    const res = await fetch(scriptUrl, {
      method: 'POST',
      body: JSON.stringify({ action: 'write', data: decks }),
    });
    const data = await res.json();
    setSyncStatus(data.ok ? 'ok' : 'error');
  } catch (e) {
    setSyncStatus('error');

function attachDeckCardBehavior(div, deckId) {
  let longPressTimer = null;
  let dragging = false;
  let startY = 0;
  let ghost = null;
  let ghostOffsetY = 0;

  const cancelLong = () => { clearTimeout(longPressTimer); };

  let dragCardH = 0;

  const beginDrag = (clientY) => {
    dragging = true;
    div.classList.add('dragging');
    dragCardH = div.getBoundingClientRect().height;

    // Create a visual ghost clone
    const rect = div.getBoundingClientRect();
    ghostOffsetY = clientY - rect.top;
    ghost = div.cloneNode(true);
    ghost.style.cssText = `
      position: fixed;
      left: ${rect.left}px;
      width: ${rect.width}px;
      top: ${clientY - ghostOffsetY}px;
      z-index: 999;
      opacity: 0.85;
      pointer-events: none;
      box-shadow: 0 12px 40px rgba(26,24,20,0.2);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 20px 20px 16px;
      transition: none;
    `;
    document.body.appendChild(ghost);
  };

  let currentTargetId = null;
  let dropTargetId = null; // track the intended drop target during drag

  const moveDrag = (clientY) => {
    if (!dragging) return;
    ghost.style.top = (clientY - ghostOffsetY) + 'px';

    const list = document.getElementById('deck-list');
    const fromIdx = decks.findIndex(d => d.id === deckId);
    const cards = [...list.querySelectorAll('.deck-card:not(.dragging)')];
    const cardH = dragCardH + 12;

    // Calculate current shifts so we can reverse them for hit-testing
    const prevToIdx = currentTargetId && currentTargetId !== '__end__'
      ? decks.findIndex(d => d.id === currentTargetId)
      : (currentTargetId === '__end__' ? decks.length : -1);

    let insertBefore = null;
    for (const card of cards) {
      const cardDeckIdx = decks.findIndex(d => d.id === card.dataset.id);
      const rect = card.getBoundingClientRect();
      // Reverse the current shift to get original position
      let currentShift = 0;
      if (prevToIdx >= 0) {
        if (fromIdx < prevToIdx && cardDeckIdx > fromIdx && cardDeckIdx < prevToIdx) currentShift = -cardH;
        else if (fromIdx > prevToIdx && cardDeckIdx >= prevToIdx && cardDeckIdx < fromIdx) currentShift = cardH;
      }
      const origTop = rect.top - currentShift;
      if (clientY < origTop + rect.height * 0.5) { insertBefore = card; break; }
    }

    const targetId = insertBefore ? insertBefore.dataset.id : '__end__';
    dropTargetId = targetId;
    if (targetId === currentTargetId) return;
    currentTargetId = targetId;

    const toIdx = insertBefore ? decks.findIndex(d => d.id === insertBefore.dataset.id) : decks.length;

    cards.forEach((card) => {
      const cardDeckIdx = decks.findIndex(d => d.id === card.dataset.id);
      let shift = 0;
      if (fromIdx < toIdx) {
        if (cardDeckIdx > fromIdx && cardDeckIdx < toIdx) shift = -cardH;
      } else {
        if (cardDeckIdx >= toIdx && cardDeckIdx < fromIdx) shift = cardH;
      }
      card.style.transition = 'transform 0.32s cubic-bezier(0.4,0,0.2,1)';
      card.style.transform = shift ? `translateY(${shift}px)` : '';
    });
  };

  const endDrag = (clientY) => {
    if (!dragging) return;
    dragging = false;

    // Use the last tracked drop target — this reflects where the gap visually was
    const finalTargetId = dropTargetId;
    currentTargetId = null;
    dropTargetId = null;

    div.classList.remove('dragging');
    if (ghost) { ghost.remove(); ghost = null; }

    const list = document.getElementById('deck-list');
    const allCards = [...list.querySelectorAll('.deck-card')];
    allCards.forEach(c => { c.style.transition = 'none'; c.style.transform = ''; });

    if (finalTargetId && finalTargetId !== '__end__' && finalTargetId !== deckId) {
      reorderDecks(deckId, finalTargetId);
    } else if (!finalTargetId || finalTargetId === '__end__') {
      const fromIdx = decks.findIndex(d => d.id === deckId);
      if (fromIdx !== -1 && fromIdx !== decks.length - 1) {
        const [moved] = decks.splice(fromIdx, 1);
        decks.push(moved);
        save(); renderHome();
      }
    }
  };

  // ── Mouse long-press ──
  div.addEventListener('mousedown', e => {
    if (e.target.closest('button')) return;
    startY = e.clientY;
    longPressTimer = setTimeout(() => {
      beginDrag(e.clientY);

      const onMove = e => moveDrag(e.clientY);
      const onUp = e => {
        endDrag(e.clientY);
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      };
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    }, 500);
  });
  div.addEventListener('mouseup', cancelLong);
  div.addEventListener('mouseleave', cancelLong);

  // ── Touch long-press ──
  let liveTouchY = 0;
  div.addEventListener('touchstart', e => {
    if (e.target.closest('button')) return;
    startY = e.touches[0].clientY;
    liveTouchY = e.touches[0].clientY;
    longPressTimer = setTimeout(() => {
      beginDrag(liveTouchY);

      const onMove = e => {
        e.preventDefault();
        liveTouchY = e.touches[0].clientY;
        moveDrag(liveTouchY);
      };
      const onEnd = e => {
        endDrag(e.changedTouches[0].clientY);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);
      };
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onEnd);
    }, 500);
  }, { passive: true });

  div.addEventListener('touchmove', e => {
    liveTouchY = e.touches[0].clientY;
    // Cancel long press only if scrolling significantly
    if (Math.abs(e.touches[0].clientY - startY) > 12) cancelLong();
  }, { passive: true });

  div.addEventListener('touchend', cancelLong);
  div.addEventListener('touchcancel', cancelLong);

  // ── Short tap → open detail ──
  div.addEventListener('click', e => {
    if (!dragging && !e.target.closest('button')) openDeckDetailModal(deckId);
  });
}

function reorderDecks(fromId, toId) {
  const fromIdx = decks.findIndex(d => d.id === fromId);
  const toIdx = decks.findIndex(d => d.id === toId);
  if (fromIdx === -1 || toIdx === -1) return;
  const [moved] = decks.splice(fromIdx, 1);
  // After removing fromIdx, if toIdx was after fromIdx it shifts down by 1
  const insertAt = fromIdx < toIdx ? toIdx - 1 : toIdx;
  decks.splice(insertAt, 0, moved);
  save(); renderHome();
}

// ── SPACED REPETITION ──
const SR_INTERVALS = [0, 1, 3, 7, 21, 60]; // days per level 1-5

function getSR(deckId) {
  const raw = localStorage.getItem('sr-' + deckId);
  return raw ? JSON.parse(raw) : {};
}
function setSR(deckId, sr) {
  localStorage.setItem('sr-' + deckId, JSON.stringify(sr));
}
function getCardSR(sr, cardId) {
  return sr[cardId] || { level: 0, nextReview: null };
}
function today() {
  const d = new Date(); d.setHours(0,0,0,0); return d.getTime();
}
function addDays(ms, days) {
  return ms + days * 86400000;
}
function isDueToday(cardData) {
  if (!cardData.nextReview) return true; // never reviewed
  return cardData.nextReview <= today();
}
function applyOverduePenalty(sr, deck) {
  // Cards overdue by >7 days drop one level
  const now = today();
  let changed = false;
  deck.cards.forEach(card => {
    const cd = getCardSR(sr, card.id);
    if (cd.nextReview && cd.level > 1 && (now - cd.nextReview) > 7 * 86400000) {
      sr[card.id] = { level: cd.level - 1, nextReview: now };
      changed = true;
    }
  });
  return changed;
}
function getDueCards(deck) {
  const sr = getSR(deck.id);
  applyOverduePenalty(sr, deck);
  setSR(deck.id, sr);
  return deck.cards.filter(card => isDueToday(getCardSR(sr, card.id)));
}
function getDueCount(deck) {
  return getDueCards(deck).length;
}
function recordSwipe(deckId, cardId, knew) {
  const sr = getSR(deckId);
  const cd = getCardSR(sr, cardId);
  let newLevel;
  if (knew) {
    newLevel = Math.min((cd.level || 0) + 1, 5);
  } else {
    newLevel = 1;
  }
  const interval = SR_INTERVALS[newLevel];
  sr[cardId] = { level: newLevel, nextReview: addDays(today(), interval) };
  setSR(deckId, sr);
}
function getNextReviewDays(deckId) {
  const sr = getSR(deckId);
  const deck = decks.find(d => d.id === deckId);
  if (!deck) return null;
  let earliest = null;
  deck.cards.forEach(card => {
    const cd = getCardSR(sr, card.id);
    if (cd.nextReview && !isDueToday(cd)) {
      const days = Math.ceil((cd.nextReview - today()) / 86400000);
      if (earliest === null || days < earliest) earliest = days;
    }
  });
  return earliest;
}

// Legacy mastery (kept for % display)
function getMastery(deckId) {
  const raw = localStorage.getItem('mastery-' + deckId);
  return raw ? JSON.parse(raw) : { known: [], notKnown: [] };
}
function setMastery(deckId, mastery) {
  localStorage.setItem('mastery-' + deckId, JSON.stringify(mastery));
}
function getMasteryPct(deck) {
  if (!deck.cards.length) return 0;
  const sr = getSR(deck.id);
  const highLevel = deck.cards.filter(c => (getCardSR(sr, c.id).level || 0) >= 3).length;
  return Math.round(highLevel / deck.cards.length * 100);
}

// ── STUDY ──
let isFirstRound = false;

function startStudy(deckId) {
  const deck = decks.find(d => d.id === deckId);
  if (!deck || !deck.cards.length) { showToast('No cards in this deck!'); return; }
  deck.lastStudied = Date.now();
  save();

  currentDeckId = deckId;
  clearStudyProgress(deckId);
  // Only show cards due today (or all if none reviewed yet)
  const dueCards = getDueCards(deck);
  studyQueue = dueCards.length > 0 ? dueCards : [...deck.cards];
  missedCards = [];
  roundKnown = 0;
  totalCards = studyQueue.length;
  currentCardIndex = 0;
  isFirstRound = true;
  isFlipped = false;

  showScreen('study');
  document.getElementById('study-deck-name').textContent = deck.name;
  // study-actions hidden

}

function exitStudy() {
  saveStudyProgress(currentDeckId, currentCardIndex, missedCards, roundKnown, isFirstRound);

}

function renderStudyCard() {
  const area = document.getElementById('card-area');

            </svg>

function updateStudyCounter() {
  const done = currentCardIndex;
  const total = studyQueue.length;
  document.getElementById('study-counter').textContent = `${done + 1} / ${total}`;
  document.getElementById('study-progress-fill').style.width = (total ? done/total*100 : 0) + '%';
}

function flipCard() {
  const fc = document.getElementById('flashcard');
  if (!fc) return;
  isFlipped = !isFlipped;
  fc.classList.toggle('flipped', isFlipped);
  if (isFlipped) setTimeout(() => speakSpanishAuto(studyQueue[currentCardIndex].es), 500);
}

function swipeCard(dir) {
  const fc = document.getElementById('flashcard');
  if (!fc) return;
  const card = studyQueue[currentCardIndex];
  const knew = dir === 'right';
  if (knew) {
    fc.classList.add('swipe-right');
    roundKnown++;
  } else {
    fc.classList.add('swipe-left');
    missedCards.push(card);
  }
  // Record spaced repetition only on first round
  if (isFirstRound) recordSwipe(currentDeckId, card.id, knew);
  // Legacy mastery
  if (isFirstRound) {
    const m = getMastery(currentDeckId);
    if (knew) { m.notKnown = m.notKnown.filter(id => id !== card.id); if (!m.known.includes(card.id)) m.known.push(card.id); }
    else { m.known = m.known.filter(id => id !== card.id); if (!m.notKnown.includes(card.id)) m.notKnown.push(card.id); }
    setMastery(currentDeckId, m);
  }
  setTimeout(() => {
    currentCardIndex++;
    saveStudyProgress(currentDeckId, currentCardIndex, missedCards, roundKnown, isFirstRound);
    renderStudyCard();
  }, 350);
}

function showRoundComplete() {
  const area = document.getElementById('card-area');

  const nextDays = getNextReviewDays(currentDeckId);

  if (missedCards.length === 0) {
    clearStudyProgress(currentDeckId);
    area.innerHTML = `

        <div class="stat-row">
          <div class="stat-box"><div class="stat-num">${roundKnown}</div><div class="stat-label">Knew it</div></div>
          <div class="stat-box"><div class="stat-num">0</div><div class="stat-label">Again</div></div>
        </div>
        <button class="btn-primary" onclick="exitStudy()" style="padding:14px 32px;font-size:15px">Done</button>
      </div>
    `;
  } else {
    area.innerHTML = `
      <div class="round-complete">
        <div class="big-emoji">💪</div>
        <h2>Round complete</h2>

  currentCardIndex = 0;

}

// ── SWIPE ──
function setupSwipe() {
  const fc = document.getElementById('flashcard');
  const front = document.getElementById('card-front');
  const back = document.getElementById('card-back');
  const speaker = document.getElementById('btn-speaker');
  if (!fc || !front || !back) return;

  const card = studyQueue[currentCardIndex];

  // Front face: tap flips to Spanish
  front.addEventListener('click', () => { if (!isDragging) flipCard(); });

  // Speaker button: read Spanish aloud, don't flip
  if (speaker) {
    speaker.addEventListener('click', (e) => {
      e.stopPropagation();
      speakText(card.es, 'es');
    });
  }

  // Back face: tap anywhere (except speaker) flips back to English
  back.addEventListener('click', (e) => {
    if (!isDragging && e.target !== speaker && !speaker.contains(e.target)) {
      flipCard();
    }
  });

  let startX = 0, startY = 0;
  let isDragging = false;
  let mouseDown = false;
  let dragMoved = false;

  const onDrag = (dx) => {
    isDragging = true;
    if (fc.classList.contains('flipped')) {
      fc.style.transform = `rotateY(180deg) translateX(${-dx}px) rotate(${-dx * 0.03}deg)`;
    } else {
      fc.style.transform = `translateX(${dx}px) rotate(${dx * 0.03}deg)`;
    }

  };

  const onRelease = (dx) => {
    fc.style.transform = '';
    if (fc.classList.contains('flipped')) fc.style.transform = 'rotateY(180deg)';

    fc.querySelector('.swipe-badge.skip').style.opacity = 0;
    if (Math.abs(dx) > 50) {
      if (dx > 0) swipeCard('right'); else swipeCard('left');
    }
    setTimeout(() => { isDragging = false; }, 0);
  };

  fc.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    isDragging = false; dragMoved = false;
  }, { passive: true });

  fc.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (!dragMoved && Math.abs(dx) < Math.abs(dy) * 0.8) return;
    dragMoved = true;
    onDrag(dx);
  }, { passive: true });

  fc.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    if (dragMoved) {
      onRelease(dx);
    }
    dragMoved = false;
  });

  fc.addEventListener('mousedown', e => {
    mouseDown = true; startX = e.clientX; isDragging = false; dragMoved = false;
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!mouseDown) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 5) { dragMoved = true; onDrag(dx); }
  });
  window.addEventListener('mouseup', e => {
    if (!mouseDown) return;
    mouseDown = false;
    const dx = e.clientX - startX;
    if (dragMoved) onRelease(dx);
    dragMoved = false;
  });
}

function startAutoplay(deckId) {
  const deck = decks.find(d => d.id === deckId);
  if (!deck || !deck.cards.length) { showToast('No cards in this deck!'); return; }
  autoplayDeckId = deckId;
  autoplayIndex = loadAutoplayPosition(deckId);
  if (autoplayIndex >= deck.cards.length) autoplayIndex = 0;
  autoplayPlaying = true;
  autoplayPrevIndex = -1;
  document.getElementById('autoplay-deck-name').textContent = deck.name;
  setPlayBtnIcon(true);
  // Reset progress to 0 before showing screen so animation fires
  const fill = document.getElementById('autoplay-progress-fill');
  if (fill) fill.style.width = '0%';
  showScreen('autoplay');
  // Small delay so the 0% renders first, then animates to card 1's value
  setTimeout(() => autoplayShowCard(autoplayIndex, true), 80);
}

function exitAutoplay() {
  stopAutoplayTimer();
  autoplayPlaying = false;
  setPlayBtnIcon(false);
  window.speechSynthesis && window.speechSynthesis.cancel();
  // Only save position if not completed (completed already saved 0)
  const enEl = document.getElementById('autoplay-en-word');
  const isComplete = enEl && enEl.textContent === '¡Muy bien!';
  if (!isComplete) saveAutoplayPosition(autoplayDeckId, autoplayIndex);
  showScreen('home');
}

let autoplayPrevIndex = -1;

function autoplayShowCard(idx, andSchedule) {
  const deck = decks.find(d => d.id === autoplayDeckId);
  if (!deck) return;
  const card = deck.cards[idx];
  const total = deck.cards.length;
  autoplayPrevIndex = idx;

  document.getElementById('autoplay-en-word').textContent = card.en;
  const esEl = document.getElementById('autoplay-es-word');
  esEl.textContent = card.es;
  esEl.style.opacity = '0';
  document.getElementById('autoplay-counter').textContent = `${idx+1} / ${total}`;
  document.getElementById('autoplay-progress-fill').style.width = ((idx+1)/total*100) + '%';

  if (andSchedule) {
    const delay = (idx === 0 && autoplayPrevIndex <= 0) ? 500 : 0;
    setTimeout(() => {
      speakTextWithCallback(card.en, 'en', () => scheduleAutoplay());
    }, delay);
  }
}

function estimateSpeechDuration(text) {
  // Average Spanish speech at rate 0.85: ~120 words/min, ~5 chars/word
  // So ~600 chars/min = 10 chars/sec → ms per char ≈ 100ms
  // Add 300ms buffer
  return Math.max(1000, text.length * 100 + 300);
}

function scheduleAutoplay() {
  stopAutoplayTimer();
  autoplayPhase = 'waiting';
  const deck = decks.find(d => d.id === autoplayDeckId);
  if (!deck) return;
  const card = deck.cards[autoplayIndex];
  // Pause = 2s + estimated duration of Spanish
  const pauseMs = 2000 + estimateSpeechDuration(card.es);
  autoplayTimer = setTimeout(() => {
    if (!autoplayPlaying) return;
    const esEl = document.getElementById('autoplay-es-word');
    if (esEl) esEl.style.opacity = '1';
    autoplayPhase = 'spanish';
    speakTextWithCallback(card.es, 'es', () => {
      autoplayPhase = 'after-spanish';
      autoplayTimer = setTimeout(() => {
        if (!autoplayPlaying) return;
        const nextIdx = autoplayIndex + 1;
        if (nextIdx >= deck.cards.length) {
          autoplayPlaying = false;
          autoplayPhase = 'english';
          setPlayBtnIcon(false);
          saveAutoplayPosition(autoplayDeckId, 0);
          showAutoplayComplete();
        } else {
          autoplayIndex = nextIdx;
          autoplayPhase = 'english';
          saveAutoplayPosition(autoplayDeckId, autoplayIndex);
          autoplayShowCard(autoplayIndex, true);
        }
      }, 3000);
    });
  }, pauseMs);
}

function showAutoplayComplete() {
  const enEl = document.getElementById('autoplay-en-word');
  const esEl = document.getElementById('autoplay-es-word');
  if (enEl) enEl.textContent = '¡Muy bien!';
  if (esEl) { esEl.textContent = 'All done'; esEl.style.opacity = '1'; }
}

function toggleAutoplay() {
  if (autoplayPlaying) {
    autoplayPlaying = false;
    stopAutoplayTimer();
    window.speechSynthesis && window.speechSynthesis.cancel();
    setPlayBtnIcon(false);
  } else {
    autoplayPlaying = true;
    setPlayBtnIcon(true);
    const deck = decks.find(d => d.id === autoplayDeckId);
    if (!deck) return;
    const atEnd = document.getElementById('autoplay-en-word').textContent === '¡Muy bien!';
    if (atEnd) {
      autoplayIndex = 0;
      autoplayPhase = 'english';
      saveAutoplayPosition(autoplayDeckId, 0);
      autoplayShowCard(0, true);
    } else if (autoplayPhase === 'spanish' || autoplayPhase === 'after-spanish') {
      // Resume from Spanish
      const card = deck.cards[autoplayIndex];
      const esEl = document.getElementById('autoplay-es-word');
      if (esEl) esEl.style.opacity = '1';
      autoplayPhase = 'spanish';
      speakTextWithCallback(card.es, 'es', () => {
        autoplayPhase = 'after-spanish';
        autoplayTimer = setTimeout(() => {
          if (!autoplayPlaying) return;
          const nextIdx = autoplayIndex + 1;
          if (nextIdx >= deck.cards.length) {
            autoplayPlaying = false;
            autoplayPhase = 'english';
            setPlayBtnIcon(false);
            saveAutoplayPosition(autoplayDeckId, 0);
            showAutoplayComplete();
          } else {
            autoplayIndex = nextIdx;
            autoplayPhase = 'english';
            saveAutoplayPosition(autoplayDeckId, autoplayIndex);
            autoplayShowCard(autoplayIndex, true);
          }
        }, 3000);
      });
    } else {
      // Resume from English
      const card = deck.cards[autoplayIndex];
      autoplayPhase = 'english';
      speakTextWithCallback(card.en, 'en', () => scheduleAutoplay());
    }
  }
}

function autoplaySkipToSpanish() {
  const esEl = document.getElementById('autoplay-es-word');
  // If Spanish is already visible, do nothing
  if (esEl && esEl.style.opacity === '1') return;
  const deck = decks.find(d => d.id === autoplayDeckId);
  if (!deck) return;

    autoplayTimer = setTimeout(() => {
      if (!autoplayPlaying) return;
      const nextIdx = autoplayIndex + 1;
      if (nextIdx >= deck.cards.length) {
        autoplayPlaying = false;
        autoplayPhase = 'english';
        setPlayBtnIcon(false);
        saveAutoplayPosition(autoplayDeckId, 0);
        showAutoplayComplete();
      } else {
        autoplayIndex = nextIdx;
        autoplayPhase = 'english';

function autoplayNext() {

function autoplayPrev() {
  stopAutoplayTimer();

// ── TTS ──
function getVoice(lang) {
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => v.lang.startsWith(lang === 'es' ? 'es' : 'en') && !v.name.includes('Google'))
      || voices.find(v => v.lang.startsWith(lang === 'es' ? 'es' : 'en'))
      || null;
}

function speakTextWithCallback(text, lang, onEnd) {
  if (!window.speechSynthesis) { onEnd && onEnd(); return; }
  window.speechSynthesis.cancel();
  setTimeout(() => {
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = lang === 'es' ? 'es-ES' : 'en-US';
    utt.rate = 0.85;
    const voice = getVoice(lang);
    if (voice) utt.voice = voice;
    let done = false;
    const finish = () => { if (!done) { done = true; onEnd && onEnd(); } };
    // Watchdog in case onend never fires
    const watchdog = setTimeout(finish, Math.max(2000, text.length * 120));
    utt.onend = () => { clearTimeout(watchdog); finish(); };
    utt.onerror = e => {
      clearTimeout(watchdog);
      if (e.error === 'interrupted') return;
      setTimeout(finish, 300);
    };
    window.speechSynthesis.speak(utt);
  }, 50);
}

function speakText(text, lang) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  setTimeout(() => {
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = lang === 'es' ? 'es-ES' : 'en-US';
    utt.rate = 0.85;
    const voice = getVoice(lang);
    if (voice) utt.voice = voice;
    window.speechSynthesis.speak(utt);
  }, 50);
}

function attachWordDrag(row, deckId) {
  let longPressTimer = null;
  let dragging = false;
  let ghost = null;
  let ghostOffsetY = 0;
  let dragCardH = 0;
  let startY = 0;
  let liveTouchY = 0;

  const cancelLong = () => clearTimeout(longPressTimer);

  const beginDrag = (clientY) => {
    dragging = true;
    dragCardH = row.getBoundingClientRect().height;
    row.classList.add('dragging');
    const rect = row.getBoundingClientRect();
    ghostOffsetY = clientY - rect.top;
    ghost = row.cloneNode(true);
    ghost.style.cssText = `position:fixed;left:${rect.left - 16}px;width:${rect.width}px;top:${clientY - ghostOffsetY}px;z-index:999;opacity:0.85;pointer-events:none;background:var(--surface);border:1.5px solid var(--accent);border-radius:8px;padding:11px 0 11px 12px;display:flex;align-items:center;gap:10px;`;
    document.body.appendChild(ghost);
  };

  let currentTargetId = null;
  let dropTargetId = null;

  const moveDrag = (clientY) => {
    if (!dragging) return;
    ghost.style.top = (clientY - ghostOffsetY) + 'px';
    const list = document.getElementById('detail-word-list');
    const deck = decks.find(d => d.id === deckId);
    const fromIdx = deck.cards.findIndex(c => c.id === row.dataset.id);
    const rows = [...list.querySelectorAll('.word-item:not(.dragging)')];
    let target = null;
    for (const r of rows) {
      const rect = r.getBoundingClientRect();
      if (clientY < rect.top + rect.height * 0.5) { target = r; break; }
    }
    const targetId = target ? target.dataset.id : '__end__';
    dropTargetId = targetId;
    if (targetId === currentTargetId) return;
    currentTargetId = targetId;
    const toIdx = target ? deck.cards.findIndex(c => c.id === target.dataset.id) : deck.cards.length;
    rows.forEach(r => {
      const rIdx = deck.cards.findIndex(c => c.id === r.dataset.id);
      let shift = 0;
      if (fromIdx < toIdx && rIdx > fromIdx && rIdx < toIdx) shift = -dragCardH;
      else if (fromIdx > toIdx && rIdx >= toIdx && rIdx < fromIdx) shift = dragCardH;
      r.style.transition = 'transform 0.28s cubic-bezier(0.4,0,0.2,1)';
      r.style.transform = shift ? `translateY(${shift}px)` : '';
    });
  };

  const endDrag = (clientY) => {
    if (!dragging) return;
    dragging = false;
    const finalTargetId = dropTargetId;
    currentTargetId = null;
    dropTargetId = null;
    row.classList.remove('dragging');
    if (ghost) { ghost.remove(); ghost = null; }
    const list = document.getElementById('detail-word-list');
    [...list.querySelectorAll('.word-item')].forEach(r => { r.style.transition = 'none'; r.style.transform = ''; });
    const deck = decks.find(d => d.id === deckId);
    const fromIdx = deck.cards.findIndex(c => c.id === row.dataset.id);
    if (finalTargetId && finalTargetId !== '__end__' && finalTargetId !== row.dataset.id) {
      const toIdx = deck.cards.findIndex(c => c.id === finalTargetId);
      if (toIdx !== -1 && fromIdx !== toIdx) {
        const [moved] = deck.cards.splice(fromIdx, 1);
        const insertAt = fromIdx < toIdx ? toIdx - 1 : toIdx;
        deck.cards.splice(insertAt, 0, moved);
        save(); renderDetailWordList(deck);
      }
    } else if (!finalTargetId || finalTargetId === '__end__') {
      if (fromIdx !== deck.cards.length - 1) {
        const [moved] = deck.cards.splice(fromIdx, 1);
        deck.cards.push(moved);
        save(); renderDetailWordList(deck);
      }
    }
    setTimeout(() => { dragging = false; }, 0);
  };

  // Mouse long-press on whole row
  row.addEventListener('mousedown', e => {
    if (e.target.closest('button')) return;
    startY = e.clientY;
    longPressTimer = setTimeout(() => {
      beginDrag(e.clientY);
      const onMove = e => moveDrag(e.clientY);
      const onUp = e => { endDrag(e.clientY); window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    }, 500);
  });
  row.addEventListener('mouseup', cancelLong);
  row.addEventListener('mouseleave', cancelLong);

  // Touch long-press on whole row
  row.addEventListener('touchstart', e => {
    if (e.target.closest('button')) return;
    startY = e.touches[0].clientY;
    liveTouchY = startY;
    longPressTimer = setTimeout(() => {
      beginDrag(liveTouchY);
      const onMove = e => { e.preventDefault(); liveTouchY = e.touches[0].clientY; moveDrag(liveTouchY); };
      const onEnd = e => { endDrag(e.changedTouches[0].clientY); document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onEnd); };
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onEnd);
    }, 500);
  }, { passive: true });
  row.addEventListener('touchmove', e => {
    liveTouchY = e.touches[0].clientY;
    if (Math.abs(liveTouchY - startY) > 12) cancelLong();
  }, { passive: true });
  row.addEventListener('touchend', cancelLong);
  row.addEventListener('touchcancel', cancelLong);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

async function translateEnToEs(mode) {
  const enInput = mode === 'edit'
    ? document.getElementById('edit-word-en-input')
    : document.getElementById('word-en-input');
  const esInput = mode === 'edit'
    ? document.getElementById('edit-word-es-input')
    : document.getElementById('word-es-input');

  const en = enInput && enInput.value.trim();
  if (!en) { showToast('Type something in English first'); return; }
  if (!scriptUrl) { showToast('Connect your Google Sheet first'); return; }

  const btn = document.getElementById('translate-btn');
  if (btn) { btn.textContent = 'Translating…'; btn.disabled = true; }

  try {
    const url = scriptUrl + '?action=translate&text=' + encodeURIComponent(en);
    const res = await fetch(url);
    const data = await res.json();
    if (data.ok && data.spanish) {
      esInput.value = data.spanish;
      showToast('Translated!');
    } else {
      showToast('Translation failed');
    }
  } catch(e) {
    showToast('Translation failed — check connection');
  } finally {
    if (btn) {
      btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l6 6"/><path d="M4 14l6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="M22 22l-5-10-5 10"/><path d="M14 18h6"/></svg> Translate from English`;
      btn.disabled = false;
    }
  }
}

function attachScriptDrag(div, scriptId) {
  let longPressTimer = null;
  let dragging = false;
  let ghost = null;
  let ghostOffsetY = 0;
  let dragCardH = 0;
  let currentTargetId = null;
  let startY = 0;
  let liveTouchY = 0;
  const cancelLong = () => clearTimeout(longPressTimer);

  const beginDrag = (clientY) => {
    dragging = true;
    dragCardH = div.getBoundingClientRect().height;
    div.classList.add('dragging');
    const rect = div.getBoundingClientRect();
    ghostOffsetY = clientY - rect.top;
    ghost = div.cloneNode(true);
    ghost.style.cssText = `position:fixed;left:${rect.left}px;width:${rect.width}px;top:${clientY-ghostOffsetY}px;z-index:999;opacity:0.85;pointer-events:none;box-shadow:var(--shadow-lg);border:1.5px solid var(--accent);border-radius:var(--radius);background:var(--surface);padding:16px 20px;`;
    document.body.appendChild(ghost);
  };
  const moveDrag = (clientY) => {
    if (!dragging) return;
    ghost.style.top = (clientY - ghostOffsetY) + 'px';
    const list = document.getElementById('script-list');
    const fromIdx = scripts.findIndex(s => s.id === scriptId);
    const rows = [...list.querySelectorAll('.script-card:not(.dragging)')];
    let target = null;
    for (const r of rows) {
      const rect = r.getBoundingClientRect();
      if (clientY < rect.top + rect.height * 0.35) { target = r; break; }
    }
    const targetId = target ? target.dataset.id : '__end__';
    if (targetId === currentTargetId) return;
    currentTargetId = targetId;
    const toIdx = target ? scripts.findIndex(s => s.id === target.dataset.id) : scripts.length;
    rows.forEach(r => {
      const rIdx = scripts.findIndex(s => s.id === r.dataset.id);
      let shift = 0;
      if (fromIdx < toIdx && rIdx > fromIdx && rIdx < toIdx) shift = -(dragCardH+12);
      else if (fromIdx > toIdx && rIdx >= toIdx && rIdx < fromIdx) shift = dragCardH+12;
      r.style.transition = 'transform 0.32s cubic-bezier(0.4,0,0.2,1)';
      r.style.transform = shift ? `translateY(${shift}px)` : '';
    });
  };
  const endDrag = (clientY) => {
    if (!dragging) return;
    dragging = false; currentTargetId = null;
    div.classList.remove('dragging');
    if (ghost) { ghost.remove(); ghost = null; }
    const list = document.getElementById('script-list');
    [...list.querySelectorAll('.script-card')].forEach(r => { r.style.transition='none'; r.style.transform=''; });
    const rows = [...list.querySelectorAll('.script-card:not(.dragging)')];
    let target = null;
    for (const r of rows) {
      const rect = r.getBoundingClientRect();
      if (clientY < rect.top + rect.height * 0.35) { target = r; break; }
    }
    const fromIdx = scripts.findIndex(s => s.id === scriptId);
    if (target && target.dataset.id !== scriptId) {
      const toIdx = scripts.findIndex(s => s.id === target.dataset.id);
      if (toIdx !== -1) { const [m] = scripts.splice(fromIdx,1); scripts.splice(toIdx,0,m); saveScripts(); renderScripts(); }
    } else if (!target && fromIdx !== scripts.length-1) {
      const [m] = scripts.splice(fromIdx,1); scripts.push(m); saveScripts(); renderScripts();
    }
    setTimeout(() => { dragging = false; }, 0);
  };

  div.addEventListener('mousedown', e => {
    if (e.target.closest('button')) return;
    startY = e.clientY;
    longPressTimer = setTimeout(() => {
      beginDrag(e.clientY);
      const onMove = e => moveDrag(e.clientY);
      const onUp = e => { endDrag(e.clientY); window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',onUp); };
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    }, 500);
  });
  div.addEventListener('mouseup', cancelLong);
  div.addEventListener('mouseleave', cancelLong);
  div.addEventListener('touchstart', e => {
    if (e.target.closest('button')) return;
    startY = e.touches[0].clientY; liveTouchY = startY;
    longPressTimer = setTimeout(() => {
      beginDrag(liveTouchY);
      const onMove = e => { e.preventDefault(); liveTouchY=e.touches[0].clientY; moveDrag(liveTouchY); };
      const onEnd = e => { endDrag(e.changedTouches[0].clientY); document.removeEventListener('touchmove',onMove); document.removeEventListener('touchend',onEnd); };
      document.addEventListener('touchmove', onMove, { passive:false });
      document.addEventListener('touchend', onEnd);
    }, 500);
  }, { passive:true });
  div.addEventListener('touchmove', e => { liveTouchY=e.touches[0].clientY; if(Math.abs(liveTouchY-startY)>12) cancelLong(); }, { passive:true });
  div.addEventListener('touchend', cancelLong);
  div.addEventListener('touchcancel', cancelLong);
}

function sentenceSplit(text) {
  // Split on newlines, tracking single vs double breaks
  const lines = text.split(/\n/).map(l => l.trim());
  const sentences = [];
  let prevWasEmpty = false;
  for (let li = 0; li < lines.length; li++) {
    const line = lines[li];
    if (line === '') {
      prevWasEmpty = true;
      continue;
    }
    const parts = line.match(/[^.!?¡¿]+[.!?¡¿]*/g)?.map(s => s.trim()).filter(Boolean) || [line];
    parts.forEach((s, i) => {
      sentences.push({
        text: s,
        lineBreakBefore: li > 0 && i === 0,
        extraSpaceBefore: prevWasEmpty && i === 0
      });
    });
    prevWasEmpty = false;
  }
  return sentences.length ? sentences : [{ text, lineBreakBefore: false, extraSpaceBefore: false }];
}
