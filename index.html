let allWords = [];
let isSelecting = false;
let selectionStart = -1;
let selectionEnd = -1;

function renderPlayerText() {
  const area = document.getElementById('player-text-area');
  area.innerHTML = '';
  allWords = [];

  playerSentences.forEach((sentObj, si) => { const s = sentObj.text;
    if (sentObj.extraSpaceBefore) {
      const spacer = document.createElement('span');
      spacer.style.cssText = 'display:block;height:0.8em;';
      area.appendChild(spacer);
    } else if (sentObj.lineBreakBefore) {
      area.appendChild(document.createElement('br'));
    }
    const sentenceDiv = document.createElement('span');
    sentenceDiv.style.cssText = 'display:inline;cursor:pointer;';
    sentenceDiv.dataset.si = si;

    const words = s.split(/(\s+)/);
    words.forEach(w => {
      if (/^\s+$/.test(w)) {
        sentenceDiv.appendChild(document.createTextNode(w));
      } else {
        const span = document.createElement('span');
        const stateClass = si < playerIndex ? 'done' : 'upcoming';
        span.className = 'player-sentence player-word ' + stateClass;
        span.dataset.si = si;
        span.dataset.wi = allWords.length;
        span.textContent = w;
        span.style.cssText = 'display:inline;border-radius:3px;transition:background 0.1s;pointer-events:auto;-webkit-user-select:none;user-select:none;';

        allWords.push({ span, si, word: w });
        sentenceDiv.appendChild(span);
      }
    });

    area.appendChild(sentenceDiv);
    area.appendChild(document.createTextNode(' '));
  });

  setupWordSelection(area);
  updateProgress();

  // Wait for layout then check if sentences need a line break
  setTimeout(() => {
    const siGroups = {};
    allWords.forEach(({span, si}) => {
      if (!siGroups[si]) siGroups[si] = [];
      siGroups[si].push(span);
    });
    Object.keys(siGroups).sort((a,b) => a-b).forEach(si => {
      const spans = siGroups[si];
      if (spans.length === 0) return;
      // Get the top of the first word of this sentence
      const firstTop = Math.round(spans[0].getBoundingClientRect().top);
      // Count words on the first line of this sentence
      let wordsOnFirstLine = 0;
      for (const s of spans) {
        if (Math.round(s.getBoundingClientRect().top) === firstTop) wordsOnFirstLine++;
        else break;
      }
      // If fewer than 3 words fit on the first line and the sentence doesn't start at the left edge
      const firstLeft = spans[0].getBoundingClientRect().left;
      const areaLeft = area.getBoundingClientRect().left + 24; // 24px padding
      const startsAtLineStart = Math.abs(firstLeft - areaLeft) < 10;
      if (wordsOnFirstLine < 3 && !startsAtLineStart) {
        const br = document.createElement('br');
        spans[0].parentNode.insertBefore(br, spans[0]);
      }
    });
  }, 100);
}

function updatePlayerHighlight() {
  allWords.forEach(({span, si}) => {
    // Only show 'active' orange via word-by-word coloring, not here
    const stateClass = si < playerIndex ? 'done' : 'upcoming';
    span.className = 'player-sentence player-word ' + stateClass;
    span.style.color = '';
    span.style.fontWeight = '';
  });
  const active = document.querySelector('.player-sentence.active');
  if (active) {
    const area = document.getElementById('player-text-area');
    if (area) {
      const areaRect = area.getBoundingClientRect();
      const elRect = active.getBoundingClientRect();
      const elCenter = elRect.top - areaRect.top + area.scrollTop;
      // Only scroll if element is in the bottom 40% of visible area
      const visibleBottom = area.scrollTop + area.clientHeight * 0.6;
      if (elCenter > visibleBottom) {
        // Jump by ~3 line heights at a time
        const lineH = elRect.height * 3.5;
        area.scrollTo({ top: area.scrollTop + lineH, behavior: 'smooth' });
      }
    }
  }
  updateProgress();
}

function updateProgress() {
  const pct = playerSentences.length ? (playerIndex / playerSentences.length * 100) : 0;
  const fill = document.getElementById('player-progress-fill');
  if (fill) fill.style.width = pct + '%';
}

function setPlayerIcon(playing) {
  const icon = document.getElementById('player-play-icon');
  if (!icon) return;
  if (playing) {
    icon.innerHTML = '<rect x="4" y="3" width="5" height="16" rx="1.5" fill="#1A1814"/><rect x="13" y="3" width="5" height="16" rx="1.5" fill="#1A1814"/>';
  } else {
    icon.innerHTML = '<polygon points="5,2 19,11 5,20" fill="#1A1814"/>';
  }
}

function togglePlayer() {
  const btn = document.getElementById('player-play-btn');
  if (btn) { btn.classList.add('pressed'); setTimeout(() => btn.classList.remove('pressed'), 300); }
  if (playerPlaying) {
    playerPlaying = false;
    stopPlayerSpeech();
    setPlayerIcon(false);
  } else {
    // Deactivate selection mode if active
    if (selectionModeActive) resetSelectionMode();
    // If finished, restart from beginning
    if (playerIndex >= playerSentences.length) {
      playerIndex = 0;
      updatePlayerHighlight();
      const area = document.getElementById('player-text-area');
      if (area) area.scrollTo({ top: 0, behavior: 'smooth' });
    }
    playerPlaying = true;
    setPlayerIcon(true);
    speakCurrent();
  }
}

let currentWordTimer = null;
let keepAliveInterval = null;

function speakCurrent() {
  if (playerIndex >= playerSentences.length) {
    playerPlaying = false;
    setPlayerIcon(false);
    const script = scripts.find(s => s.id === currentScriptId);
    if (script) { script.listenCount = (script.listenCount||0) + 1; saveScripts(); renderScripts(); }
    showToast('¡Muy bien! Finished.');
    return;
  }
  stopPlayerSpeech();
  if (!playerPlaying) return;

  const sentObj = playerSentences[playerIndex];
  const sentence = sentObj.text || sentObj;
  const words = allWords.filter(w => w.si === playerIndex);
  const wordCount = words.length;
  let boundaryFired = false;

  const utt = new SpeechSynthesisUtterance(sentence);
  utt.lang = 'es-ES';
  utt.rate = playerSpeed;

  // Pick Spanish voice
  const voices = window.speechSynthesis.getVoices();
  const pref = voices.find(v => v.lang === 'es-ES' || v.lang === 'es_ES') ||
               voices.find(v => v.lang.startsWith('es'));
  if (pref) utt.voice = pref;
  playerUtterance = utt;

  // Boundary events — Chrome/Android
  utt.onboundary = e => {
    if (e.name !== 'word') return;
    boundaryFired = true;
    clearTimeout(currentWordTimer);
    const charsBefore = sentence.slice(0, e.charIndex);
    const wordIdx = charsBefore.trim().split(/\s+/).filter(Boolean).length;
    highlightCurrentWord(playerIndex, wordIdx);
  };

  // Time-based word highlight — iOS fallback
  const msPerWord = sentence.length * 72 / Math.max(playerSpeed, 0.1) / Math.max(wordCount, 1);
  let wi = 0;
  const wordTick = () => {
    if (boundaryFired || !playerPlaying || wi >= wordCount) return;
    highlightCurrentWord(playerIndex, wi++);
    currentWordTimer = setTimeout(wordTick, msPerWord);
  };
  currentWordTimer = setTimeout(wordTick, 250);

  // Watchdog — if speech stalls, move on
  const expectedMs = Math.max(2000, sentence.length * 100 / Math.max(playerSpeed, 0.1));
  const watchdog = setTimeout(() => {
    if (playerPlaying) nextSentence();
  }, expectedMs);

  utt.onend = () => {
    clearTimeout(watchdog);
    clearTimeout(currentWordTimer);
    if (playerPlaying) nextSentence();
  };

  utt.onerror = e => {
    clearTimeout(watchdog);
    clearTimeout(currentWordTimer);
    if (e.error === 'interrupted') return; // we cancelled it intentionally
    // Retry once after brief pause
    setTimeout(() => { if (playerPlaying) speakCurrent(); }, 400);
  };

  // Keep-alive for iOS background
  keepAliveInterval = setInterval(() => {
    if (!playerPlaying) { clearInterval(keepAliveInterval); return; }
    if (window.speechSynthesis.paused) window.speechSynthesis.resume();
  }, 5000);

  window.speechSynthesis.speak(utt);
  scrollToActiveSentence();
}

function scrollToActiveSentence() {
  const area = document.getElementById('player-text-area');
  if (!area) return;
  // Find first word of active sentence
  const firstActive = allWords.find(w => w.si === playerIndex);
  if (!firstActive) return;
  const elRect = firstActive.span.getBoundingClientRect();
  const areaRect = area.getBoundingClientRect();
  const elTop = elRect.top - areaRect.top + area.scrollTop;
  const visibleBottom = area.scrollTop + area.clientHeight * 0.6;
  if (elTop > visibleBottom) {
    const lineH = elRect.height * 3.5;
    area.scrollTo({ top: area.scrollTop + lineH, behavior: 'smooth' });
  }
}

function highlightCurrentWord(si, wordOffset) {
  // Find start index of this sentence's words in allWords
  let count = 0;
  allWords.forEach(w => {
    if (w.si < si) return;
    if (w.si > si) { w.span.style.color = ''; return; }
    // same sentence
    if (count < wordOffset) {
      // already spoken — grey
      w.span.style.color = 'rgba(255,255,255,0.28)';
      w.span.style.textShadow = '';
    } else if (count === wordOffset) {
      // current word — orange, no bold (avoids reflow)
      w.span.style.color = '#D4580A';
      w.span.style.textShadow = '0 0 0.5px #D4580A';
      w.span.style.fontWeight = '400';
    } else {
      // upcoming — white
      w.span.style.color = '#fff';
      w.span.style.fontWeight = '400';
      w.span.style.textShadow = '';
    }
    count++;
  });
}

function splitIntoChunks(text, maxChars) {
  const parts = text.match(/[^,;:.!?¡¿]+[,;:.!?¡¿]*/g) || [text];
  const chunks = [];
  let current = '';
  for (const part of parts) {
    if (current.length + part.length > maxChars && current.length > 0) {
      chunks.push(current.trim());
      current = part;
    } else {
      current += part;
    }
  }
  if (current.trim()) chunks.push(current.trim());
  return chunks.length ? chunks : [text];
}

function nextSentence() {
  const prevIdx = playerIndex;
  playerIndex++;
  // Grey out all words from completed sentence
  allWords.forEach(w => {
    if (w.si === prevIdx) {
      w.span.style.color = 'rgba(255,255,255,0.28)';
      w.span.style.fontWeight = '400';
      w.span.style.textShadow = '';
      w.span.className = 'player-sentence player-word done';
    }
  });
  updateProgress();
  // Pause between sentences
  setTimeout(() => {
    if (playerPlaying) speakCurrent();
  }, 800);
}

function playerPrevSentence() {
  stopPlayerSpeech();
  playerIndex = Math.max(0, playerIndex - 1);
  updatePlayerHighlight();
  if (playerPlaying) speakCurrent();
}

function stopPlayerSpeech() {
  window.speechSynthesis && window.speechSynthesis.cancel();
  clearTimeout(currentWordTimer);
  clearInterval(keepAliveInterval);
  playerUtterance = null;
}

function setSpeed(s) {
  const newSpeed = (playerSpeed === s) ? 0.6 : s;
  playerSpeed = newSpeed;
  document.querySelectorAll('.speed-btn').forEach(b => {
    const bSpeed = parseFloat(b.dataset.speed);
    b.classList.toggle('active', bSpeed === newSpeed && newSpeed !== 0.6);
    b.style.animation = (bSpeed === s) ? 'btnPress 0.3s ease' : '';
    if (bSpeed === s) b.addEventListener('animationend', () => { b.style.animation = ''; }, { once: true });
  });
  if (playerPlaying) { stopPlayerSpeech(); speakCurrent(); }
}

// ── WORD SELECTION & FLASHCARD POPUP ──────────
function setupPlayerTextSelection() { /* handled per renderPlayerText */ }

let selectionModeActive = false;

function toggleSelectionMode() {
  selectionModeActive = !selectionModeActive;
  const btn = document.getElementById('player-add-btn');
  if (btn) {
    btn.style.animation = 'btnPress 0.3s ease';
    btn.addEventListener('animationend', () => { btn.style.animation = ''; }, { once: true });
    btn.style.color = selectionModeActive ? '#fff' : 'rgba(255,255,255,0.5)';
    btn.style.fontWeight = selectionModeActive ? '700' : '400';
  }
  if (selectionModeActive) {
    playerPlaying = false;
    stopPlayerSpeech();
    setPlayerIcon(false);
  }
}

function showAddToCardHint() {
  toggleSelectionMode();
}

function wordIdxAt(x, y) {
  // Try elementFromPoint first
  const el = document.elementFromPoint(x, y);
  if (el && el.dataset && el.dataset.wi !== undefined) return parseInt(el.dataset.wi);
  if (el) {
    const p = el.closest ? el.closest('[data-wi]') : null;
    if (p) return parseInt(p.dataset.wi);
  }
  // Fallback: find closest word span by bounding rect
  let closest = -1, minDist = Infinity;
  allWords.forEach(({span}, i) => {
    const r = span.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) return;
    const cx = Math.max(r.left, Math.min(x, r.right));
    const cy = Math.max(r.top, Math.min(y, r.bottom));
    const dist = Math.hypot(x - cx, y - cy);
    if (dist < minDist) { minDist = dist; closest = i; }
  });
  return minDist < 60 ? closest : -1;
}

function highlightRange(lo, hi) {
  const a = Math.min(lo, hi), b = Math.max(lo, hi);
  allWords.forEach(({span}, i) => {
    span.style.background = (i >= a && i <= b) ? 'rgba(212,88,10,0.45)' : '';
  });
}

function clearHighlight() {
  allWords.forEach(({span}) => { span.style.background = ''; });
}

function setupWordSelection(area) {
  let touchTimer = null;

  let tapX = 0, tapY = 0;

  area.addEventListener('touchstart', e => {
    tapX = e.touches[0].clientX;
    tapY = e.touches[0].clientY;
    if (!selectionModeActive) return;
    // Use the touched element directly for better accuracy
    const el = e.target.closest ? e.target.closest('[data-wi]') : null;
    const idx = el ? parseInt(el.dataset.wi) : wordIdxAt(tapX, tapY);
    if (idx < 0) return;
    touchTimer = setTimeout(() => {
      isSelecting = true;
      selectionStart = idx;
      selectionEnd = idx;
      highlightRange(idx, idx);
    }, 600);
  }, { passive: false });

  area.addEventListener('touchmove', e => {
    clearTimeout(touchTimer);
    if (!isSelecting) return;
    e.preventDefault();
    const t = e.touches[0];
    const el = document.elementFromPoint(t.clientX, t.clientY);
    const wordEl = el ? el.closest('[data-wi]') : null;
    const idx = wordEl ? parseInt(wordEl.dataset.wi) : wordIdxAt(t.clientX, t.clientY);
    if (idx >= 0) { selectionEnd = idx; highlightRange(selectionStart, selectionEnd); }
  }, { passive: false });

  area.addEventListener('touchend', e => {
    clearTimeout(touchTimer);
    if (isSelecting) {
      isSelecting = false;
      const lo = Math.min(selectionStart, selectionEnd);
      const hi = Math.max(selectionStart, selectionEnd);
      const text = allWords.slice(lo, hi+1).map(w => w.word).join(' ').trim();
      clearHighlight();
      if (text.length > 1) showFlashcardPopup(text);
      // Prevent the click event from firing after selection
      e.preventDefault();
      return;
    }
    if (selectionModeActive) return;
    const idx = wordIdxAt(tapX, tapY);
    if (idx < 0) return;
    const si = allWords[idx].si;
    stopPlayerSpeech();
    playerPlaying = false;
    setPlayerIcon(false);
    playerIndex = si;
    updatePlayerHighlight();
    const firstWord = allWords.find(w => w.si === si);
    if (firstWord) {
      const areaRect = area.getBoundingClientRect();
      const wordRect = firstWord.span.getBoundingClientRect();
      const targetScroll = area.scrollTop + (wordRect.top - areaRect.top) - area.clientHeight * 0.35;
      area.scrollTo({ top: Math.max(0, targetScroll), behavior: 'smooth' });
    }
    setTimeout(() => {
      playerPlaying = true;
      setPlayerIcon(true);
      speakCurrent();
    }, 1000);
  });

  // MOUSE (desktop)
  area.addEventListener('mousedown', e => {
    if (!selectionModeActive) return;
    const idx = wordIdxAt(e.clientX, e.clientY);
    if (idx < 0) return;
    isSelecting = true;
    selectionStart = idx;
    selectionEnd = idx;
    highlightRange(idx, idx);
  });
  area.addEventListener('mousemove', e => {
    if (!isSelecting || !e.buttons) return;
    const idx = wordIdxAt(e.clientX, e.clientY);
    if (idx >= 0) { selectionEnd = idx; highlightRange(selectionStart, selectionEnd); }
  });
  window.addEventListener('mouseup', e => {
    if (!isSelecting) return;
    isSelecting = false;
    const lo = Math.min(selectionStart, selectionEnd);
    const hi = Math.max(selectionStart, selectionEnd);
    const text = allWords.slice(lo, hi+1).map(w => w.word).join(' ').trim();
    clearHighlight();
    if (text.length > 1 && document.getElementById('script-player')?.classList.contains('active')) {
      showFlashcardPopup(text);
    }
  });
}

async function showFlashcardPopup(spanishText) {
  // Remove any existing popup
  const existing = document.getElementById('fc-popup-overlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'fc-popup-overlay';
  overlay.id = 'fc-popup-overlay';

  overlay.innerHTML = `
    <div class="fc-popup">
      <div style="font-size:10px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;">Save as flashcard</div>
      <div class="form-group">
        <label>Spanish</label>
        <input type="text" id="fc-es" value="${spanishText.replace(/"/g,'&quot;')}" style="font-style:italic;" />
      </div>
      <div class="form-group">
        <label>English <span style="font-style:italic;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-3);font-size:10px;">· suggested</span></label>
        <input type="text" id="fc-en" placeholder="Translating…" />
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="dismissFcPopup()">Dismiss</button>
        <button class="btn-primary" onclick="saveFcCard()">Save to deck</button>
      </div>
    </div>
  `;

  overlay.addEventListener('click', e => { if (e.target === overlay) dismissFcPopup(); });
  document.body.appendChild(overlay);

  // Translate via Apps Script
  if (scriptUrl) {
    try {
      const res = await fetch(scriptUrl + '?action=translate&text=' + encodeURIComponent(spanishText));
      const data = await res.json();
      const enInput = document.getElementById('fc-en');
      if (enInput && data.ok && data.spanish) enInput.value = data.spanish;
      else if (enInput) enInput.placeholder = 'Translation failed — type manually';
    } catch(e) {
      const enInput = document.getElementById('fc-en');
      if (enInput) enInput.placeholder = 'Translation failed — type manually';
    }
  } else {
    const enInput = document.getElementById('fc-en');
    if (enInput) enInput.placeholder = 'Connect Sheet for auto-translation';
  }
}

function resetSelectionMode() {
  selectionModeActive = false;
  const btn = document.getElementById('player-add-btn');
  if (btn) { btn.style.color = 'rgba(255,255,255,0.5)'; btn.style.fontWeight = '400'; }
}

function dismissFcPopup() {
  const el = document.getElementById('fc-popup-overlay');
  if (el) el.remove();
  resetSelectionMode();
}

function saveFcCard() {
  const es = document.getElementById('fc-es')?.value.trim();
  const en = document.getElementById('fc-en')?.value.trim();
  if (!es || !en) { showToast('Fill in both fields'); return; }

  const script = scripts.find(s => s.id === currentScriptId);
  const deckName = script ? script.title : 'Scripts';

  // Find or create deck with script title
  let deck = decks.find(d => d.name === deckName);
  if (!deck) {
    deck = { id: uid(), name: deckName, lastStudied: null, cards: [] };
    decks.push(deck);
  }

  deck.cards.push({ id: uid(), en, es, ctx: '' });
  save(); renderHome();
  dismissFcPopup();
  resetSelectionMode();
  showToast(`Saved to "${deckName}"!`);
}

// ── CURRENT VIEW ─────────────────────────────
let currentView = 'decks'; // 'decks' | 'scripts'

function switchToView(view) {
  if (currentView === view) return;
  currentView = view;
  const isScripts = view === 'scripts';

  // 1. Fade out subtitle
  const subtitle = document.getElementById('header-subtitle');
  subtitle.style.opacity = '0';

  setTimeout(() => {
    // 2. Swap subtitle text
    subtitle.textContent = isScripts ? 'scripts' : 'flash cards';
    subtitle.style.opacity = '1';

    // 3. Update + button action
    const addBtn = document.getElementById('header-add-btn');
    addBtn.onclick = isScripts ? openAddScriptModal : openAddDeckModal;
    addBtn.title = isScripts ? 'New script' : 'New deck';

    // 4. Animate pills
    const pillsRow = document.getElementById('pills-row');
    pillsRow.style.opacity = '0';
    setTimeout(() => {
      if (isScripts) {
        pillsRow.innerHTML = '<button class="filter-pill active">All</button>';
      } else {
        pillsRow.innerHTML = `
          <button class="filter-pill active" data-filter="all" onclick="setFilter('all')">All</button>
          <button class="filter-pill" data-filter="situations" onclick="setFilter('situations')">Situations</button>
          <button class="filter-pill" data-filter="verbs" onclick="setFilter('verbs')">Verbs</button>
          <button class="filter-pill" data-filter="due" onclick="setFilter('due')" id="due-pill">Due</button>
        `;
      }
      // Stagger pills fade in (no slide)
      const pills = pillsRow.querySelectorAll('.filter-pill');
      pills.forEach((p, i) => {
        p.style.opacity = '0';
        p.style.transition = `opacity 0.4s ${i * 0.15}s ease`;
        setTimeout(() => { p.style.opacity = '1'; }, 20);
      });
      pillsRow.style.opacity = '1';
    }, 150);

    // 5. Swap content with staggered card animation
    const deckWrap = document.getElementById('deck-list-wrap');
    const scriptWrap = document.getElementById('script-list-wrap');

    if (isScripts) {
      deckWrap.style.display = 'none';
      scriptWrap.style.display = 'block';
      animateCardsIn('script-list');
    } else {
      scriptWrap.style.display = 'none';
      deckWrap.style.display = 'block';
      animateCardsIn('deck-list');
    }

    // 6. Update nav dots
    updateNavDots(isScripts ? 'scripts' : 'home');

  }, 200);
}

function animateCardsIn(listId) {
  const list = document.getElementById(listId);
  if (!list) return;
  const cards = list.querySelectorAll('.deck-card, .script-card');
  cards.forEach((card, i) => {
    card.style.opacity = '0';
    card.style.transform = 'translateX(-20px)';
    card.style.transition = `opacity 0.3s ${i * 0.07}s ease, transform 0.3s ${i * 0.07}s ease`;
    setTimeout(() => { card.style.opacity = '1'; card.style.transform = ''; }, 20);
  });
}

// ── SWIPE HOME ↔ SCRIPTS ───────────────────
function setupHomeSwipe() {
  let startX = 0, startY = 0;
  let isSwiping = false;
  const threshold = 50;
  const el = document.getElementById('home');
  if (!el) return;

  el.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    isSwiping = false;
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    // Only mark as swipe if clearly more horizontal than vertical
    if (!isSwiping && Math.abs(dx) > Math.abs(dy) * 1.5 && Math.abs(dx) > 12) {
      isSwiping = true;
    }
  }, { passive: true });

  el.addEventListener('touchend', e => {
    if (!isSwiping) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) < threshold) return;
    if (dx < 0 && currentView === 'decks') switchToView('scripts');
    if (dx > 0 && currentView === 'scripts') switchToView('decks');
    isSwiping = false;
  }, { passive: true });

  // Mouse drag (desktop)
  let mouseStartX = 0;
  let mouseDragging = false;
  el.addEventListener('mousedown', e => {
    if (e.target.closest('button,input,select,textarea,.deck-card,.script-card')) return;
    mouseStartX = e.clientX;
    mouseDragging = true;
  });
  window.addEventListener('mouseup', e => {
    if (!mouseDragging) return;
    mouseDragging = false;
    const dx = e.clientX - mouseStartX;
    if (Math.abs(dx) < threshold) return;
    if (dx < 0 && currentView === 'decks') switchToView('scripts');
    if (dx > 0 && currentView === 'scripts') switchToView('decks');
  });
}

function updateNavDots(activeScreen) {
  document.querySelectorAll('.nav-dot').forEach(d => {
    d.style.background = d.dataset.screen === activeScreen ? 'var(--accent)' : 'var(--border)';
  });
}

function setupDirectionalSnap() {
  const home = document.getElementById('home');
  if (!home) return;
  let snapTimer = null;
  let lastScrollY = 0;
  let scrollDir = 0;
  let isSnapping = false;

  home.addEventListener('touchstart', e => {
    lastScrollY = home.scrollTop;
    clearTimeout(snapTimer);
    isSnapping = false; // user touched — cancel any ongoing snap
  }, { passive: true });

  home.addEventListener('scroll', () => {
    if (isSnapping) return; // ignore scroll events triggered by our own snap
    const current = home.scrollTop;
    scrollDir = current > lastScrollY ? 1 : -1;
    lastScrollY = current;
    clearTimeout(snapTimer);
    snapTimer = setTimeout(() => {
      isSnapping = true;
      doSnap(scrollDir);
      // Allow new snaps after animation settles
      setTimeout(() => { isSnapping = false; }, 600);
    }, 120);
  }, { passive: true });
}

function doSnap(direction) {
  const home = document.getElementById('home');
  if (!home) return;
  const header = home.querySelector('.home-header');
  const headerH = header ? header.offsetHeight : 0;
  const scrollTop = home.scrollTop;

  // Get all card elements
  const cards = home.querySelectorAll('.deck-card, .script-card');
  if (!cards.length) return;

  // Find snap targets (top of each card relative to scroll container)
  const targets = Array.from(cards).map(card => {
    return card.offsetTop - headerH;
  });
  targets.unshift(0); // top of list

  // Find best target based on direction
  let best = null;
  if (direction > 0) {
    // Scrolling down — snap to next card whose top is below current scroll
    best = targets.find(t => t > scrollTop + 10);
    if (best == null) best = targets[targets.length - 1];
  } else {
    // Scrolling up — snap to previous card whose top is above current scroll
    const above = targets.filter(t => t < scrollTop - 10);
    best = above.length ? above[above.length - 1] : 0;
  }

  home.scrollTo({ top: Math.max(0, best), behavior: 'smooth' });
}
